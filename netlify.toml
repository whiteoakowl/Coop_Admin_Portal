# Netlify deployment config - see MIGRATION.md for the full story.
#
# This wraps the whole Express app (server.js) in one Netlify Function
# (netlify/functions/app.js) via serverless-http, so every existing route
# keeps its exact same URL. Static files actually present in `public/` at
# build time (CSS, client JS, name-tag-render-core.js, favicon, etc.) are
# served directly by Netlify's CDN - Netlify serves a matching file from
# the publish directory before falling through to a redirect, so those
# never touch the function at all. Everything else (every page render,
# every /admin/* and /kiosk/* route, form POSTs) falls through the
# catch-all redirect below into the one function, which is Express's own
# router from there - Netlify doesn't need to know this app has more than
# one route.
#
# NOT yet a complete deployment - see netlify/functions/app.js's own
# header comment and MIGRATION.md: the database backend (db/postgres.js)
# and file storage (utils/storage.js, Supabase Storage) both have to be
# cut over from their current SQLite/local-disk versions in the same
# deploy as this config, or the function boots against a database/upload
# directory that doesn't persist between invocations.

[build]
  command = "npm install"
  publish = "public"

[functions]
  directory = "netlify/functions"
  # Node built-ins (fs, path, crypto) plus this app's own deps (express,
  # pg, bcryptjs, multer, xlsx, @supabase/supabase-js) all bundle cleanly
  # with esbuild via their normal top-of-file `require(...)` calls - no
  # native addons in the dependency tree once db/postgres.js (pure-JS `pg`
  # driver) replaced node:sqlite as the DB layer.
  node_bundler = "esbuild"
  # Two exceptions esbuild's static analysis can't see, both confirmed by
  # real deploy failures rather than guessed at:
  # - `ejs`: Express's View class loads the view engine via `require(ext)`
  #   with `ext` computed at runtime from the view engine's name (see
  #   server.js's `app.set('view engine', 'ejs')`) rather than a literal
  #   `require('ejs')` anywhere in this app's own code - failed with
  #   "Cannot find module 'ejs'" on the very first page render.
  # - `xlsx`: already bundles fine for the *main* thread's own
  #   `require('xlsx')` in utils/spreadsheet.js (a literal, traceable
  #   require) - but utils/spreadsheetWorker.js runs in a separate
  #   worker_threads Worker (see included_files below for why that file
  #   itself isn't bundled at all), which does its own independent
  #   `require('xlsx')` that esbuild's trace from the main entry point
  #   never sees or bundles for.
  # Marking both external tells Netlify to include their real
  # node_modules files in the function bundle instead of trying to
  # statically trace them.
  external_node_modules = ["ejs", "xlsx"]
  # esbuild only bundles the JS module graph it can trace via require() -
  # it has no idea these files are read straight from disk at runtime by
  # code that never `require()`s them:
  # - views/** - server.js's app.set('views', ...) (every *.ejs template).
  # - utils/spreadsheetWorker.js - loaded by `new Worker(path)` in
  #   utils/spreadsheet.js's readRowsFromFile (the CSV/XLSX import parser,
  #   isolated in its own thread with a hard timeout as a mitigation for
  #   the installed xlsx version's unpatched ReDoS advisory - see that
  #   file's own header comment). A Worker script path is not a
  #   `require()` call, so esbuild has no way to trace or bundle it.
  # included_files copies both into the deployed function bundle, landing
  # at /var/task/views/... and /var/task/utils/spreadsheetWorker.js - see
  # server.js's and utils/spreadsheet.js's own comments on why they
  # resolve these paths via LAMBDA_TASK_ROOT to match where these actually
  # end up, instead of the __dirname they use for a normal local/LAN
  # install.
  included_files = ["views/**", "utils/spreadsheetWorker.js"]

# Every path not matched by an actual file in `public/` falls through to
# the one function - this has to be the last/only redirect rule (a 200
# status here means "rewrite", not "redirect": the browser's URL bar
# never changes, so /admin/members keeps looking like /admin/members).
[[redirects]]
  from = "/*"
  to = "/.netlify/functions/app"
  status = 200

# Security headers Netlify's CDN adds to every response, static or
# function-served alike - belt-and-suspenders alongside whatever the
# Express app itself already sets per-response (see server.js's own
# X-Content-Type-Options header and middleware/csrfProtection.js).
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
